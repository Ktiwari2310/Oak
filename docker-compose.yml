
services:
  postgres:
    image: postgres:17
    container_name: oak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: harsh
      POSTGRES_DB: oak
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oak"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: oak-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oak
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: harsh
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
